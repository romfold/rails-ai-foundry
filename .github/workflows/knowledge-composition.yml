name: Integrated knowledge composition

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  knowledge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: recipes/domain-knowledge-rag-rom-res-elasticsearch-pgvector
    env:
      BUNDLE_FROZEN: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.10'
          bundler: '2.6.9'
          bundler-cache: false
      - name: Install matching PostgreSQL client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/foundry-pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
      - name: Install independent locked dependencies
        run: bundle install
      - name: Start disposable integrations
        run: docker compose up -d --wait
      - name: Verify bounded reads, process recovery and workflow prerequisites
        run: |
          bin/setup
          bin/verify
          bundle exec rubocop
      - name: Service logs
        if: failure()
        run: docker compose logs
      - name: Stop disposable integrations
        if: always()
        run: docker compose down -v
