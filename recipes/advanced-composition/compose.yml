services:
  postgres:
    image: postgres:17.11
    ports: ['127.0.0.1:55432:5432']
    environment:
      POSTGRES_PASSWORD: foundry
      POSTGRES_DB: foundry_composition_test
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres']
      interval: 2s
      timeout: 2s
      retries: 30
