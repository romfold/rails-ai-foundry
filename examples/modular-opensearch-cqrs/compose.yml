services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_PASSWORD: foundry
    ports:
      - "127.0.0.1:${PGPORT:-55432}:5432"
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  opensearch:
    image: opensearchproject/opensearch:2.19.3
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'
    ports:
      - "127.0.0.1:59200:9200"
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:9200/_cluster/health"]
      interval: 5s
      timeout: 5s
      retries: 60
